[tool.poetry]
name = "emanet-subtitles-offline"
version = "0.3.0"
license = "MIT"
description = "Pipeline 100% offline: Whisper (turc) -> FR NLLB, batch, bench, debug avancé."
authors = ["Votre Nom <vous@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
yt-dlp = "^2024.7.1"
ffmpeg-python = "^0.2.0"
pydantic = "<2"
structlog = "^22.3"
pydub = "^0.25.1"
typer = {version="^0.9", extras=["all"]}
requests = "^2.32.0"
python-dotenv = "^1.0.1"
pysrt = "^1.1.2"
faster-whisper = "^1.1.1"
transformers = "^4.41.0"
sentencepiece = "^0.1.99"
sacremoses = "^0.1.1"
torch = {version = "^2.2", markers = "platform_system != 'Windows'"}
accelerate = "^0.30.0"
tqdm = "^4.66.0"
rich = "^13.7.1"
uvicorn = "^0.27.0"
fastapi = "^0.110.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
flake8 = "^7.0.0"
black = "^24.4.0"
mypy = "^1.10.0"
pytest-cov = "^5.0.0"

[tool.poetry.scripts]
emanet-subtitles = "src.cli:app"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


