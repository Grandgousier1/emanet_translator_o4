name: CI
on: [push, pull_request]
jobs:
  offline-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('pyproject.toml') }}
      - name: Install deps
        run: poetry install
      - name: Lint
        run: poetry run flake8 src test
      - name: Tests
        run: poetry run pytest -q

